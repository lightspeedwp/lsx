on: pull_request

name: Inspections
jobs:
  runPHPCSInspection:
    name: Run PHPCS inspection
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Run PHPCS inspection
      # Non-blocking for now: this is the first time PHPCS has actually run
      # against phpcs.xml.dist's real ruleset (the old rtCamp-based setup
      # passed its own hardcoded args and never loaded this file, and had
      # been failing outright on a dead token before that) -- it surfaces
      # pre-existing violations across the codebase, not anything from the
      # current PR. Same pattern tour-operator/ci.yml already uses for its
      # own legacy WPCS debt. Flip continue-on-error to false once cleared.
      continue-on-error: true
      uses: 10up/wpcs-action@stable
      with:
        # Registers PHPCompatibilityWP alongside WPCS so phpcs.xml.dist's
        # <rule ref="PHPCompatibilityWP" /> resolves; use_local_config then
        # picks up phpcs.xml.dist's actual ruleset (paths, excludes, sniff
        # overrides) instead of re-declaring them here.
        standard: '10up-Default'
        use_local_config: 'true'
