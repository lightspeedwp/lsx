on: pull_request

name: Inspections
jobs:
  runPHPCSInspection:
    name: Run PHPCS inspection
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Run PHPCS inspection
      uses: 10up/wpcs-action@stable
      with:
        # Registers PHPCompatibilityWP alongside WPCS so phpcs.xml.dist's
        # <rule ref="PHPCompatibilityWP" /> resolves; use_local_config then
        # picks up phpcs.xml.dist's actual ruleset (paths, excludes, sniff
        # overrides) instead of re-declaring them here.
        standard: '10up-Default'
        use_local_config: 'true'
